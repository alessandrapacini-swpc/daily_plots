name: Generate and Update NOAA Plots

on:
  schedule:
    # Runs every 12 hours (adjust cron as needed)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit the plots back to the repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run plot generation script
      run: python generate_plots.py

    - name: Commit and push plots
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated plot update"
        file_pattern: "NOAA_Plots/*.jpg"
